# Task-Ayuza on one computer, published by Tailscale Funnel. Started by deploy/setup.ps1.
# No host ports are opened: HTTPS terminates in the tailscale container on this computer,
# the backend shares its network namespace and listens on 127.0.0.1:8000 only.
# Secrets come from deploy/.env (generated by setup.ps1, never committed).
name: task-ayuza
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayuza_admin
      POSTGRES_PASSWORD: ${TA_ADMIN_PASSWORD:?run setup.ps1}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayuza_admin"]
      interval: 5s
      timeout: 5s
      retries: 12
  init:
    build: {context: .., dockerfile: Dockerfile}
    command: python scripts/local_init.py
    environment:
      TA_DB_HOST: db
      TA_ADMIN_USER: ayuza_admin
      TA_ADMIN_PASSWORD: ${TA_ADMIN_PASSWORD}
      TA_MIGRATOR_PW: ${TA_MIGRATOR_PW:?run setup.ps1}
      TA_RUNTIME_PW: ${TA_RUNTIME_PW:?run setup.ps1}
      TA_BACKUP_PW: ${TA_BACKUP_PW:?run setup.ps1}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  tailscale:
    image: tailscale/tailscale:v1.104.6
    hostname: task-ayuza
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run setup.ps1}
      TS_AUTH_ONCE: "true"          # the key is needed only for the first login; state persists
      TS_HOSTNAME: task-ayuza
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
  backend:
    build: {context: .., dockerfile: Dockerfile}
    network_mode: service:tailscale
    command: uvicorn backend.main:app --host 127.0.0.1 --port 8000 --no-proxy-headers
    restart: unless-stopped
    environment:
      TASK_AYUZA_DATABASE_URL: postgresql+psycopg://task_ayuza_runtime:${TA_RUNTIME_PW}@db:5432/task_ayuza_test
      TASK_AYUZA_ORIGIN: https://${TA_HOSTNAME:?run setup.ps1}
      TASK_AYUZA_AUTH_HMAC_KEY: ${TA_HMAC_KEY:?run setup.ps1}
      TASK_AYUZA_MFA_KEY: ${TA_MFA_KEY:?run setup.ps1}
      # tailscaled proxies from 127.0.0.1 and sets X-Forwarded-For to the real client address.
      TASK_AYUZA_TRUSTED_PROXIES: 127.0.0.1
      TASK_AYUZA_ARGON2_MAX_CONCURRENT: "4"
      TASK_AYUZA_OUTBOX_INTERVAL: "30"
    depends_on:
      init: {condition: service_completed_successfully}
      tailscale: {condition: service_started}
volumes:
  pgdata:
  tsstate:
